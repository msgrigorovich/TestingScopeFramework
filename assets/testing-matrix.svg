<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#faf8f2"/>

  <!-- Corner cell: axis legend -->
  <rect x="20" y="20" width="130" height="60" rx="4" fill="#ece7da"/>
  <line x1="150" y1="20" x2="20" y2="80" stroke="#cfc8b4" stroke-width="1"/>
  <text x="140" y="34" text-anchor="end" font-size="10" font-weight="700" letter-spacing="0.5" fill="#4b4636">IMPACT</text>
  <text x="30" y="72" text-anchor="start" font-size="10" font-weight="700" letter-spacing="0.5" fill="#4b4636">COMPLEXITY</text>

  <!-- Column headers: Impact Analysis (XS..XL) -->
  <g font-size="18" font-weight="800" fill="#4b4636" text-anchor="middle">
    <rect x="150" y="20" width="110" height="60" rx="4" fill="#ece7da"/>
    <text x="205" y="57">XS</text>
    <rect x="260" y="20" width="110" height="60" rx="4" fill="#ece7da"/>
    <text x="315" y="57">S</text>
    <rect x="370" y="20" width="110" height="60" rx="4" fill="#ece7da"/>
    <text x="425" y="57">M</text>
    <rect x="480" y="20" width="110" height="60" rx="4" fill="#ece7da"/>
    <text x="535" y="57">L</text>
    <rect x="590" y="20" width="110" height="60" rx="4" fill="#ece7da"/>
    <text x="645" y="57">XL</text>
  </g>

  <!-- Row headers: Complexity Dev (XS..XL) -->
  <g font-size="18" font-weight="800" fill="#4b4636" text-anchor="middle">
    <rect x="20" y="80" width="130" height="60" rx="4" fill="#ece7da"/>
    <text x="85" y="117">XS</text>
    <rect x="20" y="140" width="130" height="60" rx="4" fill="#ece7da"/>
    <text x="85" y="177">S</text>
    <rect x="20" y="200" width="130" height="60" rx="4" fill="#ece7da"/>
    <text x="85" y="237">M</text>
    <rect x="20" y="260" width="130" height="60" rx="4" fill="#ece7da"/>
    <text x="85" y="297">L</text>
    <rect x="20" y="320" width="130" height="60" rx="4" fill="#ece7da"/>
    <text x="85" y="357">XL</text>
  </g>

  <!-- Data cells: Impact Analysis QA result, colored XS (green) -> XL (red) -->
  <g font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">
    <!-- Complexity = XS -->
    <rect x="150" y="80" width="110" height="60" rx="4" fill="#49c35c"/><text x="205" y="117">XS</text>
    <rect x="260" y="80" width="110" height="60" rx="4" fill="#88cc1e"/><text x="315" y="117">S</text>
    <rect x="370" y="80" width="110" height="60" rx="4" fill="#e3b520"/><text x="425" y="117">M</text>
    <rect x="480" y="80" width="110" height="60" rx="4" fill="#e3b520"/><text x="535" y="117">M</text>
    <rect x="590" y="80" width="110" height="60" rx="4" fill="#f37a24"/><text x="645" y="117">L</text>

    <!-- Complexity = S -->
    <rect x="150" y="140" width="110" height="60" rx="4" fill="#88cc1e"/><text x="205" y="177">S</text>
    <rect x="260" y="140" width="110" height="60" rx="4" fill="#88cc1e"/><text x="315" y="177">S</text>
    <rect x="370" y="140" width="110" height="60" rx="4" fill="#e3b520"/><text x="425" y="177">M</text>
    <rect x="480" y="140" width="110" height="60" rx="4" fill="#f37a24"/><text x="535" y="177">L</text>
    <rect x="590" y="140" width="110" height="60" rx="4" fill="#f37a24"/><text x="645" y="177">L</text>

    <!-- Complexity = M -->
    <rect x="150" y="200" width="110" height="60" rx="4" fill="#88cc1e" stroke="#111827" stroke-width="3"/><text x="205" y="237">S</text>
    <rect x="260" y="200" width="110" height="60" rx="4" fill="#e3b520"/><text x="315" y="237">M</text>
    <rect x="370" y="200" width="110" height="60" rx="4" fill="#e3b520"/><text x="425" y="237">M</text>
    <rect x="480" y="200" width="110" height="60" rx="4" fill="#f37a24"/><text x="535" y="237">L</text>
    <rect x="590" y="200" width="110" height="60" rx="4" fill="#ea4c46"/><text x="645" y="237">XL</text>

    <!-- Complexity = L -->
    <rect x="150" y="260" width="110" height="60" rx="4" fill="#e3b520"/><text x="205" y="297">M</text>
    <rect x="260" y="260" width="110" height="60" rx="4" fill="#e3b520"/><text x="315" y="297">M</text>
    <rect x="370" y="260" width="110" height="60" rx="4" fill="#f37a24"/><text x="425" y="297">L</text>
    <rect x="480" y="260" width="110" height="60" rx="4" fill="#f37a24"/><text x="535" y="297">L</text>
    <rect x="590" y="260" width="110" height="60" rx="4" fill="#ea4c46"/><text x="645" y="297">XL</text>

    <!-- Complexity = XL -->
    <rect x="150" y="320" width="110" height="60" rx="4" fill="#e3b520"/><text x="205" y="357">M</text>
    <rect x="260" y="320" width="110" height="60" rx="4" fill="#f37a24"/><text x="315" y="357">L</text>
    <rect x="370" y="320" width="110" height="60" rx="4" fill="#f37a24"/><text x="425" y="357">L</text>
    <rect x="480" y="320" width="110" height="60" rx="4" fill="#ea4c46"/><text x="535" y="357">XL</text>
    <rect x="590" y="320" width="110" height="60" rx="4" fill="#ea4c46"/><text x="645" y="357">XL</text>
  </g>

  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#6b6252">Highlighted: Impact = XS, Complexity = M &#8594; Impact Analysis QA = S (worked example)</text>
</svg>
